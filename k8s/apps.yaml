apiVersion: apps/v1
kind: Deployment
metadata:
  name: processor
  labels:
    app: processor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: processor
  template:
    metadata:
      labels:
        app: processor
    spec:
      containers:
      - name: processor
        image: inventory-processor:latest
        imagePullPolicy: IfNotPresent # Important for local images
        env:
          - name: KAFKA_BOOTSTRAP_SERVERS
            value: "kafka:9092"
          - name: SPRING_PROFILES_ACTIVE
            value: "processor" # Though redundant with separate images, keeping for consistency
      initContainers:
      - name: wait-for-kafka
        image: busybox
        command: ['sh', '-c', 'until nc -z kafka 9092; do echo waiting for kafka; sleep 2; done;']
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sink
  labels:
    app: sink
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sink
  template:
    metadata:
      labels:
        app: sink
    spec:
      containers:
      - name: sink
        image: inventory-sink:latest
        imagePullPolicy: IfNotPresent
        env:
          - name: KAFKA_BOOTSTRAP_SERVERS
            value: "kafka:9092"
          - name: REDIS_HOST
            value: "redis"
          - name: SPRING_PROFILES_ACTIVE
            value: "sink"
      initContainers:
      - name: wait-for-deps
        image: busybox
        command: ['sh', '-c', 'until nc -z kafka 9092 && nc -z redis 6379; do echo waiting for deps; sleep 2; done;']
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
      - name: api
        image: inventory-api:latest
        imagePullPolicy: IfNotPresent
        ports:
          - containerPort: 8080
        env:
          - name: REDIS_HOST
            value: "redis"
          - name: SPRING_PROFILES_ACTIVE
            value: "api"
      initContainers:
      - name: wait-for-redis
        image: busybox
        command: ['sh', '-c', 'until nc -z redis 6379; do echo waiting for redis; sleep 2; done;']
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  type: LoadBalancer # Or NodePort for local K8s
  selector:
    app: api
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30080
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-external # Service to expose Kafka for send_events.sh
spec:
  type: LoadBalancer 
  selector:
    app: kafka
  ports:
  - port: 9094
    targetPort: 9092 # Mapping external port to internal 9092 (might need listener config change if external access is required)
    nodePort: 30094
