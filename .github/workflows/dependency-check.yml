name: OWASP dependency-check

# NVD updates can be slow / rate-limited; run on demand or weekly.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  dependency-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Aggregate dependency check
        run: mvn -B -Pdependency-check verify -DskipTests
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
